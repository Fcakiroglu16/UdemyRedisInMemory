version: '3.8'

services:
  redis:
    image: redis:alpine
    # Redis'e hangi konfigürasyon dosyasını kullanacağını söylüyoruz:
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      # 1. Kendi redis.conf dosyamızı container'ın içine kopyalıyoruz:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      
      # 2. Verilerin kalıcı olması için data volume'unu bağlıyoruz:
      - redis-data:/data

volumes:
  redis-data: