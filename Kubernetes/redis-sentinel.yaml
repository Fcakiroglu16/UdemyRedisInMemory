apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    # Redis Configuration
    requirepass admin
    masterauth admin
    bind 0.0.0.0
    port 6379
    dir /data
    appendonly yes
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      initContainers:
        - name: config
          image: redis:latest
          command: [ "sh", "-c" ]
          args:
            - |
              cp /tmp/redis/redis.conf /etc/redis/redis.conf
              
              # Get pod hostname and ordinal index
              HOSTNAME=$(hostname)
              INDEX=${HOSTNAME##*-}
              
              if [ "$INDEX" = "0" ]; then
                echo "This is redis-0, configuring as master..."
                # Master config is already set in base redis.conf
              else
                echo "This is redis-$INDEX, configuring as replica of redis-0..."
                echo "replicaof redis-0.redis 6379" >> /etc/redis/redis.conf
              fi
              
              cat /etc/redis/redis.conf
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis/
            - name: config
              mountPath: /tmp/redis/
      containers:
        - name: redis
          image: redis:7.0.10-alpine
          command: ["redis-server"]
          args: ["/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/
      volumes:
        - name: redis-config
          emptyDir: {}
        - name: config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel
spec:
  serviceName: sentinel
  replicas: 3
  selector:
    matchLabels:
      app: sentinel
  template:
    metadata:
      labels:
        app: sentinel
    spec:
      initContainers:
        - name: config
          image: redis:latest
          command: [ "sh", "-c" ]
          args:
            - |
              REDIS_PASSWORD=admin
              # Default master is redis-0
              MASTER="redis-0.redis"
              
              # Try to find the current master
              nodes="redis-0.redis redis-1.redis redis-2.redis"
              for node in $nodes; do
                echo "Checking if $node is master..."
                ROLE=$(redis-cli --no-auth-warning -a $REDIS_PASSWORD -h $node info replication 2>/dev/null | grep role | cut -d ":" -f2 | tr -d '[:space:]')
                echo "Role for $node: $ROLE"
                if [ "$ROLE" = "master" ]; then
                  MASTER=$node
                  echo "Found master: $MASTER"
                  break
                fi
              done
              
              echo "Configuring sentinel to monitor master at $MASTER"
              
              cat > /etc/redis/sentinel.conf << EOF
              port 5000
              sentinel resolve-hostnames yes
              sentinel announce-hostnames yes
              sentinel monitor mymaster $MASTER 6379 2
              sentinel down-after-milliseconds mymaster 5000
              sentinel failover-timeout mymaster 60000
              sentinel parallel-syncs mymaster 1
              sentinel auth-pass mymaster $REDIS_PASSWORD
              EOF
              
              cat /etc/redis/sentinel.conf
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis/
      containers:
        - name: sentinel
          image: redis:7.0.10-alpine
          command: ["redis-sentinel"]
          args: ["/etc/redis/sentinel.conf"]
          ports:
            - containerPort: 5000
              name: sentinel
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis/
            - name: data
              mountPath: /data
      volumes:
        - name: redis-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel
spec:
  clusterIP: None
  ports:
    - port: 5000
      targetPort: 5000
      name: sentinel
  selector:
    app: sentinel
